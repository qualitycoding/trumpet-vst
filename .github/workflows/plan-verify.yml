# SPDX-License-Identifier: Apache-2.0
# Planning-only verification (D-022): builds the stubs with the plugin on three OSes, runs the frozen suites (expected
# red, except the D-018 guards), and validates the stub plugin (pluginval strictness 10; auval on macOS).
# The implementer replaces this workflow by .github/workflows/ci.yml in S-002.
name: plan-verify
on:
  push:
    branches: ["gen-*"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  stub-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
            libxi-dev libcurl4-openssl-dev libegl-dev libgl-dev xvfb ninja-build
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        shell: bash
        run: cmake --build build --config Release --parallel 4
      - name: Red run (expected failures)
        shell: bash
        run: |
          ctest --test-dir build -C Release -LE perf --output-on-failure > red.txt 2>&1 || true
          grep -E "tests passed|Test +#|Failed|Passed" red.txt | head -40 || true
      - name: Plugin tests (expected red except guards)
        shell: bash
        run: |
          EXE=$(find build -name 'tpt_plugin_tests*' -type f \( -perm -u+x -o -name '*.exe' \) | head -1)
          echo "plugin test binary: $EXE"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a "$EXE" --reporter compact || true; else "$EXE" --reporter compact || true; fi
      - name: pluginval on the stub VST3 (must pass)
        shell: bash
        run: |
          VST3=$(find build -name 'Trumpet.vst3' -maxdepth 6 | head -1)
          echo "bundle: $VST3"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a bash tests/scripts/run_pluginval.sh "$VST3"; else bash tests/scripts/run_pluginval.sh "$VST3"; fi
      - name: auval on the stub AU (must pass)
        if: runner.os == 'macOS'
        run: |
          COMP=$(find build -name 'Trumpet.component' -maxdepth 6 | head -1)
          mkdir -p ~/Library/Audio/Plug-Ins/Components && cp -R "$COMP" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -v aumu Tpts Qcod

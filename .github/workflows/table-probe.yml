# SPDX-License-Identifier: Apache-2.0
# Temporary probe: regenerates the resonator table on several runners and compares it with the committed table.
name: table-probe
on:
  push:
    branches: ["impl-*"]
permissions:
  contents: read
jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, '[table-probe]') }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Virtual environment
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          ln -sfn "$RUNNER_TEMP/venv" .venv
          .venv/bin/pip install --require-hashes -r tools/requirements.hashes.txt
      - name: Regenerate and compare
        run: |
          grep -m1 'model name' /proc/cpuinfo | tee "$RUNNER_TEMP/r.txt"
          .venv/bin/python -m tools.resonator.generate_table --fingerings tests/fixtures/trumpet_fingerings.txt --out "$RUNNER_TEMP/t.json" --keep-calibration data/trumpet_resonators.json
          .venv/bin/python - <<'PY' | tee -a "$RUNNER_TEMP/r.txt"
          import json, os, numpy as np
          a = json.load(open(os.environ["RUNNER_TEMP"] + "/t.json")); b = json.load(open("data/trumpet_resonators.json"))
          w = 0.0
          for sa, sb in zip(a["states"], b["states"]):
              for ma, mb in zip(sa["modes"], sb["modes"]):
                  x = np.array(ma["s"] + ma["R"]); y = np.array(mb["s"] + mb["R"]); w = max(w, float(np.max(np.abs(x - y) / np.abs(y))))
          print("max relative difference to the committed table: %.3e" % w)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: probe-${{ matrix.n }}
          path: ${{ runner.temp }}/r.txt
          retention-days: 1
